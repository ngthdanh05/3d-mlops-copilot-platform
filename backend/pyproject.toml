[project]
name = "mlops-copilot-backend"
version = "0.1.0"
description = "FastAPI backend for the 3D-MLOps Copilot Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=3,<4",
    "httpx>=0.27",
]

[dependency-groups]
training = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=1.26,<3",
    "pillow>=10",
    "psutil>=6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "scikit-learn>=1.5",
    "pytest-cov>=5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async layer runs DB code in greenlets; trace them too.
concurrency = ["greenlet", "thread"]
omit = ["app/utils/seed_data.py"]  # dev-only utility, covered by tests/test_seed_data.py

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
